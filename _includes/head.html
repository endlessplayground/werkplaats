<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ site.description }}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:ital,wght@0,100;0,300;0,400;0,500;0,700;0,800;0,900;1,100;1,300;1,400;1,500;1,700;1,800;1,900&family=Fira+Sans:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Rammetto+One&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/forms.css' | relative_url }}">
  {% if page.page_css %}
    <link rel="stylesheet" href="{{ '/assets/css/' | relative_url }}{{ page.page_css }}.css">
  {% endif %}

{% if page.custom_css %}
<link rel="stylesheet" href="{{ '/assets/css/' | append: page.custom_css | append: '.css' | relative_url }}">
{% endif %}

  <link rel="icon" type="image/svg+xml"
      href="{{ '/assets/images/favicon.svg' | relative_url }}">

<link rel="manifest" href="{{ '/manifest.json' | relative_url }}">

<meta name="theme-color" content="#00bfff">
<meta name="mobile-web-app-capable" content="yes">

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {

    navigator.serviceWorker.register(
      "{{ '/sw.js' | relative_url }}"
    )
    .then(registration => {
      console.log('Werkplaats app registered:', registration.scope);
    })
    .catch(error => {
      console.error('Service worker registration failed:', error);
    });

  });
}
</script>

</head>
