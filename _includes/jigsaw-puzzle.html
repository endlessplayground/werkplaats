<style>
.puzzle {
    background-image: url('{{ "/assets/images/" | append: page.puzzle_background | relative_url }}');
}
#toggle-pieces {
    background-image: url('{{ "/assets/images/jig-hide.svg" | relative_url }}');
    background-repeat: no-repeat;
    background-position: center;
    background-size: 90%;
    background-color: var(--green-darker);
}

.puzzle.pieces-hidden .puzzle-piece {
    visibility: hidden;
}

#toggle-pieces.pieces-hidden {
    background-image: url('{{ "/assets/images/jig-view.svg" | relative_url }}');
}






main {
  flex: 1;
  padding: 18px 0px 80px 0px;
}

.puzzle {
    display: grid;
    width: 357px;
    height: 416px;
    grid-template-columns: repeat(7, 50.4px);
    gap: 0;
    margin: 0 auto;
    padding: 0;
    border-right: 2px solid rgba(208, 224, 195, 0.6);
    border-bottom: 2px solid rgba(154, 183, 174, 0.32);
    border-left: 2px solid  rgba(235, 244, 225, 0.9);
    border-top: 2px solid rgba(235, 244, 225, 0.9);
    transform: scale(0.94);
    background-size: cover;
    background-position: center;
}

.puzzle-piece {
    display: block;
    width: 84px;
    height: auto;
    margin: -16.8px;
    padding: 0;
    border: 0;
    cursor: pointer;
    transition: filter 0.2s ease, opacity 0.2s ease;
}

.puzzle-piece.selected {
    filter: hue-rotate(120deg);
}

.puzzle-piece.hidden {
    opacity: 0;
}

.row {
    display: flex;
    flex-direction: row;
    height: 40px;
    background: aqua;
    align-items: center;
    justify-content: center;
}

button {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 35px;
    height: 35px;
    margin: 0 0 0 10px;
    border-radius: 50%;
    background: var(--green-darker);
}

button img {
    width: 28px;
}









h2 {
  display: flex;
  flex-direction: row;
  justify-content: center;
  align-items: center;
  margin: 0 20px 22px 0;
  font-size: 1.3rem;
  font-weight: 800;
}

.submenu-item:first-child {
    transform: scale(1.2);
    background: var(--main-color);
    font-weight: bold;
    color: white;
    text-shadow: 0px 0.3px 2px rgba(29, 27, 44, 0.95);
}

.puzzle-heading {
    display: flex;
    flex-direction: row;
    justify-content: center;
    align-items: center;
    margin: 0 20px 22px 0;
    font-size: 1.3rem;
    font-weight: 800;
}

.puzzle-select-wrap {
    position: relative;
    display: inline-flex;
    align-items: center;
    margin-right: 6px;
}

.puzzle-page-select {
    appearance: none;
    -webkit-appearance: none;
    border: none;
    outline: none;
    background: transparent;
    color: inherit;
    font-family: inherit;
    font-size: inherit;
    font-weight: inherit;
    cursor: pointer;
    max-width: 250px;
    background-color: aqua;
    text-align: right !important;
    direction: rtl;
}

.puzzle-select-arrow {
    position: absolute;
    right: 2px;
    pointer-events: none;
    font-size: 0.65em;
    color: inherit;
}

h2.puzzle-heading select.puzzle-page-select {
    all: unset !important;

    display: inline-block !important;
    appearance: none !important;
    -webkit-appearance: none !important;

    font-family: inherit !important;
    font-size: 1.3rem !important;
    font-weight: 800 !important;
    line-height: normal !important;
    color: inherit !important;

    cursor: pointer !important;
    padding: 0 26px 0 0 !important;
    margin: 0 !important;
    max-width: 250px !important;
}

h2.puzzle-heading .puzzle-select-wrap {
    position: relative !important;
    display: inline-flex !important;
    align-items: center !important;
}

h2.puzzle-heading .puzzle-select-arrow {
    width: 18px;
    height: 18px;
    right: 0;
    background: url("{{ '/assets/images/dropdown-triangle.svg' | relative_url }}") center / contain no-repeat;
    font-size: 0;
}

</style>

<h2 class="puzzle-heading">

    <span class="puzzle-select-wrap">
        <select class="puzzle-page-select"
                aria-label="Kies een puzzel"
                onchange="if(this.value) window.location.href=this.value;">

{% assign puzzle_pages = site.pages
    | where: "category", page.category
    | sort: "puzzle_title"
%}

{% for puzzle in puzzle_pages %}
    {% if puzzle.puzzle_title and puzzle.puzzle_title != "" %}
        <option value="{{ puzzle.url | relative_url }}"
            {% if puzzle.url == page.url %}selected{% endif %}>
            {{ puzzle.puzzle_title }}
        </option>
    {% endif %}
{% endfor %}


        </select>
        <span class="puzzle-select-arrow">▾</span>
    </span>

    <button id="reset-puzzle" type="button">
        <img src="{{ '/assets/images/reload.svg' | relative_url }}">
    </button>

    <button id="toggle-pieces" type="button">
        <!-- Keep your existing button content here -->
    </button>

</h2>
