
<!DOCTYPE html>
<html lang="en">

{% include head.html %}

<body class="{{ page.category | default: 'default' }}" id="top">

  <div class="phone-screen">

    <header>
      <a href="{{ '/' | relative_url }}">
        <img src="{{ '/assets/images/header.svg' | relative_url }}"
             alt="{{ site.title }}">
      </a>
    </header>

    {% assign submenu = site.data.submenus[page.submenu] %}
    
    <!-- DEBUG: page.submenu={{ page.submenu | jsonify }} | submenu={{ submenu | jsonify }} -->

  <nav class="submenu" aria-label="Page navigation">
    {% for item in submenu %}
      <a href="{{ item.url | relative_url }}"
        class="submenu-item{% if item.url == page.url %} active{% endif %}{% if item.dimmed %} dimmed{% endif %}{% if item.up %} up{% endif %}">
{% if item.image %}
  <img src="{{ item.image | relative_url }}" class="devil-icon" alt="Devil">
{% else %}
  {{ item.title }}
{% endif %}
</a>
    {% endfor %}
  </nav>

    <main>
      {{ content }}
    </main>

{% include footer.html %}

  </div>

</body>
</html>
