
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ site.description }}">

  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/checklists.css' | relative_url }}">


  <link rel="icon" type="image/svg+xml"
      href="{{ '/assets/images/favicon.svg' | relative_url }}">
</head>

<body>
  <div class="phone-screen">

    <header>
      <a href="{{ '/' | relative_url }}">
        <img src="{{ '/assets/images/header.svg' | relative_url }}"
             alt="{{ site.title }}">
      </a>
    </header>

    {% assign submenu = site.data.submenus[page.submenu] %}

  <nav class="submenu" aria-label="Page navigation">
    {% for item in submenu %}
      <a href="{{ item.url | relative_url }}"
        class="submenu-item{% if item.url == page.url %} active{% endif %}{% if item.dimmed %} dimmed{% endif %}">
        {{ item.title }}
      </a>
    {% endfor %}
  </nav>

    <main>
      {{ content }}
    </main>

    <footer>
      <a href="{{ '/' | relative_url }}"><div class="home"><img src="{{ '/assets/images/home.svg' | relative_url }}"></div></a>
    </footer>

  </div>
</body>
</html>
