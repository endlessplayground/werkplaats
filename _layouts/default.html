
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ site.description }}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:ital,wght@0,100;0,300;0,400;0,500;0,700;0,800;0,900;1,100;1,300;1,400;1,500;1,700;1,800;1,900&family=Fira+Sans:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Rammetto+One&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
<!--  <link rel="stylesheet" href="{{ '/assets/css/checklists.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/groc-super.css' | relative_url }}">-->
  <link rel="stylesheet" href="{{ '/assets/css/bestellijst.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/lists-new.css' | relative_url }}">
  


  <link rel="icon" type="image/svg+xml"
      href="{{ '/assets/images/favicon.svg' | relative_url }}">
</head>

<body>
  <div class="phone-screen">

    <header>
      <a href="{{ '/' | relative_url }}">
        <img src="{{ '/assets/images/header.svg' | relative_url }}"
             alt="{{ site.title }}">
      </a>
    </header>

    {% assign submenu = site.data.submenus[page.submenu] %}

  <nav class="submenu" aria-label="Page navigation">
    {% for item in submenu %}
      <a href="{{ item.url | relative_url }}"
        class="submenu-item{% if item.url == page.url %} active{% endif %}{% if item.dimmed %} dimmed{% endif %}">
        {{ item.title }}
      </a>
    {% endfor %}
  </nav>

    <main>
      {{ content }}
    </main>

    <footer>
      <a href="{{ '/' | relative_url }}"><div class="home"><img src="{{ '/assets/images/home.svg' | relative_url }}"></div></a>
    </footer>

  </div>
</body>
</html>
