
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ site.description }}">

  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

  <link rel="icon" type="image/svg+xml"
      href="{{ '/assets/images/favicon.svg' | relative_url }}">
</head>

<body>
  <div class="phone-screen">

    <header>
      <a href="{{ '/' | relative_url }}">
        <img src="{{ '/assets/images/header.svg' | relative_url }}"
             alt="{{ site.title }}">
      </a>
    </header>

    <main class="home-main">
      {{ content }}
    </main>

    <footer>
      <a href="{{ 'https://endlessplayground.github.io/huismusopavontuur/' | relative_url }}"><div class="home"><img src="{{ '/assets/images/ik.svg' | relative_url }}"></div></a>
    </footer>

  </div>
</body>
</html>
